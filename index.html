<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sribudinar Solution — Sistem Pengurusan Data</title>
<style>
/* ============ RESET & ASAS ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#eef2f9; --sidebar:#0f172a; --sidebar-2:#1e293b;
  --primary:#2563eb; --primary-d:#1d4ed8;
  --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --card:#ffffff;
  --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
  --radius:14px; --shadow:0 4px 18px rgba(15,23,42,.08);
}
html,body{height:100%}
body{
  font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
code{background:#eef2f9;padding:2px 6px;border-radius:6px;font-size:12px;color:#0f172a}

/* ============ LOGIN ============ */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 50%,#2563eb 100%);
  padding:24px;position:relative;overflow:hidden;
}
.login-wrap::before,.login-wrap::after{
  content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.06);
}
.login-wrap::before{width:420px;height:420px;top:-140px;right:-120px}
.login-wrap::after{width:320px;height:320px;bottom:-120px;left:-100px}
.login-card{
  position:relative;z-index:2;width:100%;max-width:400px;
  background:#fff;border-radius:20px;padding:38px 32px 28px;
  box-shadow:0 25px 60px rgba(0,0,0,.35);animation:pop .45s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.login-logo{
  width:64px;height:64px;border-radius:18px;margin:0 auto 16px;
  background:linear-gradient(135deg,#2563eb,#1e3a8a);
  color:#fff;font-weight:800;font-size:24px;
  display:flex;align-items:center;justify-content:center;
  letter-spacing:1px;box-shadow:0 8px 22px rgba(37,99,235,.4);
}
.login-card h1{font-size:21px;text-align:center;letter-spacing:.3px}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 26px}
.login-card label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:6px}
.login-card input{
  width:100%;padding:12px 14px;margin-bottom:16px;
  border:1.5px solid var(--border);border-radius:10px;
  background:#f8fafc;transition:.2s;outline:none;
}
.login-card input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.btn-login{
  width:100%;padding:13px;border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;font-weight:700;font-size:15px;letter-spacing:.4px;
  transition:.2s;box-shadow:0 8px 20px rgba(37,99,235,.35);
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(37,99,235,.45)}
.btn-login:active{transform:translateY(0)}
.login-error{color:var(--bad);font-size:12.5px;text-align:center;margin-top:12px;min-height:18px;font-weight:600}
.login-hint{
  margin-top:22px;padding-top:18px;border-top:1px dashed var(--border);
  font-size:12.5px;color:var(--muted);line-height:1.9;
}
.login-hint strong{display:block;color:#334155;margin-bottom:4px;font-size:12px;letter-spacing:.4px;text-transform:uppercase}

/* ============ SUSUN ATUR APP ============ */
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{
  width:250px;flex-shrink:0;background:var(--sidebar);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  transition:transform .28s ease;z-index:50;
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
  color:#fff;font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.brand-name{color:#fff;font-weight:700;font-size:15px;line-height:1.1}
.brand-sub{color:#64748b;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase}
#nav{flex:1;padding:14px 10px;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 13px;border-radius:10px;margin-bottom:4px;
  color:#94a3b8;font-size:14px;font-weight:500;
  text-align:left;transition:.18s;text-decoration:none;
}
.nav-item:hover{background:var(--sidebar-2);color:#e2e8f0}
.nav-item.active{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.4);
}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
  color:#fff;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.user-name{color:#e2e8f0;font-size:13.5px;font-weight:600;line-height:1.2}
.user-role{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.7px}
.btn-logout{
  width:100%;padding:9px;border-radius:9px;
  background:rgba(239,68,68,.12);color:#f87171;
  font-size:13px;font-weight:600;transition:.18s;
  border:1px solid rgba(239,68,68,.25);
}
.btn-logout:hover{background:rgba(239,68,68,.22);color:#fca5a5}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:#fff;padding:16px 26px;
  display:flex;align-items:center;gap:14px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;
}
.topbar h2{font-size:18px;font-weight:700;flex:1}
.menu-toggle{display:none;font-size:20px;color:var(--text);padding:4px 8px;border-radius:8px}
.menu-toggle:hover{background:var(--bg)}
.role-badge{
  font-size:11px;font-weight:800;letter-spacing:1px;
  padding:6px 12px;border-radius:20px;background:#dbeafe;color:#1d4ed8;
}
.role-badge.user{background:#dcfce7;color:#15803d}
.content{padding:24px 26px 48px;flex:1}

/* ============ KOMPONEN ============ */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:#fff;border:1.5px solid var(--border);
  border-radius:11px;padding:9px 14px;flex:1;min-width:220px;
  max-width:400px;transition:.2s;
}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search-box input{border:none;outline:none;background:none;width:100%;font-size:14px}
.toolbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.count-chip{
  background:#fff;border:1.5px solid var(--border);
  padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);
}
.readonly-chip{
  background:#fef3c7;color:#92400e;border:1.5px solid #fde68a;
  padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;
}
.btn{
  padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  transition:.18s;display:inline-flex;align-items:center;gap:7px;
}
.btn-primary{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.3);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(37,99,235,.4)}
.btn-ghost{background:#f1f5f9;color:#475569}
.btn-ghost:hover{background:#e2e8f0}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-danger:hover{background:#fecaca}

/* Jadual */
.table-wrap{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow-x:auto;border:1px solid var(--border);
}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{
  background:#f8fafc;text-align:left;padding:13px 16px;font-size:11.5px;
  font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:13px 16px;font-size:13.5px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fafc}
.actions-col{text-align:right;white-space:nowrap;width:1%}
.icon-btn{font-size:14px;padding:7px 9px;border-radius:8px;transition:.16s;line-height:1}
.icon-btn:hover{background:#e2e8f0}
.icon-btn.del:hover{background:#fee2e2}
.muted{color:#cbd5e1}

.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.bad{background:#fee2e2;color:#b91c1c}
.badge.neutral{background:#e2e8f0;color:#475569}

.file-link{
  color:var(--primary);text-decoration:none;font-weight:600;font-size:12.5px;
  display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:middle;
}
.file-link:hover{text-decoration:underline}

.empty{
  background:#fff;border-radius:var(--radius);padding:56px 20px;
  text-align:center;color:var(--muted);font-size:14px;border:1.5px dashed var(--border);
}

/* Dashboard */
.stat-grid{display:grid;gap:16px;margin-bottom:26px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);border:1px solid var(--border);
  display:flex;align-items:center;gap:14px;transition:.2s;
  cursor:pointer;text-decoration:none;color:inherit;
}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,23,42,.12)}
.stat-ico{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;background:#dbeafe;
}
.stat-val{font-size:23px;font-weight:800;line-height:1}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}

.section-title{font-size:14px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.panel{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:22px}
.fin-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fin-item{background:#f8fafc;border-radius:12px;padding:15px 16px;border-left:4px solid var(--primary)}
.fin-item.green{border-left-color:var(--ok)}
.fin-item.orange{border-left-color:var(--warn)}
.fin-lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fin-val{font-size:19px;font-weight:800;margin-top:6px}

.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.bar-lbl{width:110px;font-size:12.5px;font-weight:600;color:#475569;flex-shrink:0}
.bar-track{flex:1;height:10px;background:#eef2f9;border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;transition:width .6s ease}
.bar-num{width:28px;text-align:right;font-size:12.5px;font-weight:700;color:#475569}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:200;animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:18px;width:100%;max-width:620px;
  max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 30px 70px rgba(0,0,0,.35);animation:slideUp .25s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16.5px;font-weight:700}
.modal-close{font-size:17px;color:var(--muted);padding:6px 10px;border-radius:8px;transition:.16s}
.modal-close:hover{background:#f1f5f9;color:var(--text)}
.modal-body{padding:22px 24px;overflow-y:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-row{display:flex;flex-direction:column}
.form-row.full{grid-column:1/-1}
.form-row label{font-size:12.5px;font-weight:600;color:#334155;margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea{
  padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;
  background:#f8fafc;outline:none;transition:.18s;width:100%;
}
.form-row textarea{resize:vertical;min-height:76px}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{
  border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1);
}
.form-row input[type=file]{padding:8px;background:#fff;font-size:12.5px;cursor:pointer}
.file-current{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.modal-foot{
  display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;
  border-top:1px solid var(--border);background:#f8fafc;border-radius:0 0 18px 18px;
}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail-item{background:#f8fafc;border-radius:10px;padding:12px 14px}
.detail-item.full{grid-column:1/-1}
.detail-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.detail-val{font-size:13.5px;font-weight:500;word-break:break-word}

.toast{
  position:fixed;bottom:26px;right:26px;z-index:500;
  background:#0f172a;color:#fff;padding:13px 20px;border-radius:12px;
  font-size:13.5px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.3);
  animation:toastIn .3s ease;display:flex;align-items:center;gap:9px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 60px rgba(0,0,0,.5)}
  .menu-toggle{display:block}
  .content{padding:18px 16px 44px}
  .topbar{padding:14px 16px}
  .form-grid,.detail-grid{grid-template-columns:1fr}
}
@media (max-width:520px){
  .login-card{padding:30px 22px 22px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .stat-card{padding:14px;gap:10px}
  .stat-ico{width:38px;height:38px;font-size:16px}
  .stat-val{font-size:19px}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">SB</div>
    <h1>Sribudinar Solution</h1>
    <p class="sub">Sistem Pengurusan Data Syarikat</p>

<form id="loginForm" autocomplete="on">
      <label for="username">ID Pengguna</label>
      <input type="text" id="username" placeholder="Masukkan ID pengguna" autocomplete="username" required>

<label for="password">Kata Laluan</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>

<button type="submit" class="btn-login">Log Masuk</button>
      <div id="loginError" class="login-error"></div>
    </form>

<div class="login-hint">
      <strong>Akaun</strong>
      Admin: <code>admin</code> / <code>admin123</code><br>
      User: <code>user</code> / <code>user123</code>
    </div>
  </div>
</div>

<!-- ================= APLIKASI ================= -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">SB</div>
      <div>
        <div class="brand-name">Sribudinar</div>
        <div class="brand-sub">Solution</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="userAvatar">A</div>
        <div>
          <div class="user-name" id="userName">Admin</div>
          <div class="user-role" id="userRole">Administrator</div>
        </div>
      </div>
      <button class="btn-logout" id="logoutBtn">⏻ Log Keluar</button>
    </div>
  </aside>

<main class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <h2 id="pageTitle">Status</h2>
      <span class="role-badge" id="roleBadge">ADMIN</span>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
/* =========================================================
   SRIBUDINAR SOLUTION — LOGIK APLIKASI (Vanilla JS)
   ========================================================= */

/* ---------- 1. PENGGUNA ---------- */
const USERS = {
  admin: { password: 'admin123', role: 'admin', name: 'Administrator' },
  user:  { password: 'user123',  role: 'user',  name: 'Pengguna Biasa' }
};

/* ---------- 2. STORAN (JSONBIN) ---------- */
const STORAGE_KEY = 'sribudinar_db_v1';
const SESSION_KEY = 'sribudinar_session';
const MAX_FILE_MB = 1.5;

const JSONBIN_BIN_ID = '6b03eeecac6210605a9d5d43';
const JSONBIN_MASTER_KEY = '$2a$10$/R1HUnMU8AhZJ6G8ER/hgOTMT0nHu5/gpCQZZSnOBKA9XQ137RO.2';

const Store = {
  async get(k) {
    // Sesi login disimpan di localStorage tempatan supaya tidak bercanggah antara pengguna
    if (k === SESSION_KEY) return localStorage.getItem(k);
    
    // Data utama (DB) diambil dari JSONBin
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return JSON.stringify(data.record);
    } catch (e) {
      console.error('Gagal muat dari JSONBin:', e);
      return null;
    }
  },
  async set(k, v) {
    if (k === SESSION_KEY) return localStorage.setItem(k, v);

    try {
      await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_MASTER_KEY
        },
        body: v
      });
    } catch (e) {
      console.error('Gagal simpan ke JSONBin:', e);
    }
  },
  del(k) {
    if (k === SESSION_KEY) return localStorage.removeItem(k);
  }
};

let DB = null;
let currentUser = null;
let currentPage = 'status';
const searchState = {};
let formFileData = {};

/* ---------- 3. UTILITI ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}
function money(v){
  if (v === '' || v === null || v === undefined) return '—';
  const n = Number(v);
  if (isNaN(n)) return esc(v);
  return 'RM ' + n.toLocaleString('ms-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function badgeClass(s){
  const t = String(s || '').toLowerCase();
  if (/batal|tolak|gagal|lewah|tertunggak/.test(t)) return 'bad';
  if (/belum|pending|proses|sebahagian|menunggu/.test(t)) return 'warn';
  if (/siap|selesai|lulus|diterima|aktif|dibayar|bayar|baik/.test(t)) return 'ok';
  return 'neutral';
}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '✅ ' + esc(msg);
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; }, 1900);
  setTimeout(() => el.remove(), 2300);
}
function isAdmin(){ return currentUser && currentUser.role === 'admin'; }

/* ---------- 4. MODUL ---------- */
const MODULES = {
  projek: {
    label:'Projek', icon:'📁',
    columns:['nama','klien','lokasi','nilai','status'],
    fields:[
      { key:'nama',        label:'Nama Projek',        type:'text',   required:true },
      { key:'klien',       label:'Klien / Agensi',     type:'text',   required:true },
      { key:'lokasi',      label:'Lokasi',             type:'text' },
      { key:'nilai',       label:'Nilai Kontrak (RM)', type:'number', money:true },

/* ---------- 6. MUAT / SIMPAN ---------- */
async function loadDB(){
  const raw = await Store.get(STORAGE_KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        Object.keys(MODULES).forEach(k => { if (!Array.isArray(parsed[k])) parsed[k] = []; });
        return parsed;
      }
    } catch (e) { console.warn('Data JSONBin rosak — guna benih.', e); }
  }
  const seed = createSeed();
  await Store.set(STORAGE_KEY, JSON.stringify(seed));
  return seed;
}
function saveDB(){
  Store.set(STORAGE_KEY, JSON.stringify(DB)).catch(e => console.error('Gagal simpan data:', e));
}

/* ---------- 7. LOGIN / LOGOUT ---------- */
function handleLogin(e){
  e.preventDefault();
  const idEl  = document.getElementById('username');
  const pwEl  = document.getElementById('password');
  const errEl = document.getElementById('loginError');
  const id = (idEl.value || '').trim().toLowerCase();
  const pw = pwEl.value || '';

  if (!id || !pw) { errEl.textContent = 'Sila isi ID pengguna dan kata laluan.'; return; }

  const acc = Object.prototype.hasOwnProperty.call(USERS, id) ? USERS[id] : null;
  if (!acc || acc.password !== pw) {
    errEl.textContent = 'ID pengguna atau kata laluan tidak sah.';
    console.log('[LOGIN] ID diterima:', JSON.stringify(id), '| panjang password:', pw.length);
    return;
  }

  errEl.textContent = '';
  currentUser = { id, role: acc.role, name: acc.name };
  Store.set(SESSION_KEY, JSON.stringify(currentUser));
  document.getElementById('loginForm').reset();
  showApp();
}

function logout(){
  Store.del(SESSION_KEY);
  currentUser = null;
  currentPage = 'status';
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('modalRoot').innerHTML = '';
  if (location.hash) {
    try { history.replaceState(null, '', location.href.split('#')[0]); }
    catch (e) { location.hash = ''; }
  }
}

function showApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userRole').textContent = isAdmin() ? 'Administrator' : 'Pengguna';
  document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();

  const rb = document.getElementById('roleBadge');
  rb.textContent = isAdmin() ? 'ADMIN' : 'USER';
  rb.className = 'role-badge' + (isAdmin() ? '' : ' user');

  renderNav();

  const page = parseHash();
  ensureHash(page);
  setPage(page);
}

/* ---------- 8. NAVIGASI + ROUTING HASH ---------- */
function parseHash(){
  const h = (location.hash || '').replace(/^#\/?/, '').trim();
  if (!h) return 'status';
  if (h === 'status' || MODULES[h]) return h;
  return 'status';
}
function ensureHash(page){
  const target = '#/' + page;
  if (location.hash !== target) {
    try { history.replaceState(null, '', target); }
    catch (e) { /* fallback senyap */ }
  }
}

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = PAGE_ORDER.map(key => {
    const isDash = key === 'status';
    const label = isDash ? 'Status' : MODULES[key].label;
    const icon  = isDash ? '📊' : MODULES[key].icon;
    return `<a class="nav-item" href="#/${key}" data-page="${key}">
      <span class="ico">${icon}</span><span>${esc(label)}</span>
    </a>`;
  }).join('');

  nav.querySelectorAll('.nav-item').forEach(link => {
    link.addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
    });
  });
}

function setPage(page){
  if (!MODULES[page] && page !== 'status') page = 'status';
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(a => {
    a.classList.toggle('active', a.dataset.page === page);
  });
  const title = page === 'status' ? 'Status Keseluruhan' : MODULES[page].label;
  document.getElementById('pageTitle').textContent = title;
  renderPage();
}

function navigate(page){
  if (!MODULES[page] && page !== 'status') page = 'status';
  const target = '#/' + page;
  if (location.hash === target) {
    setPage(page);
  } else {
    location.hash = target;
  }
}

window.addEventListener('hashchange', () => {
  if (!currentUser) return;
  const page = parseHash();
  ensureHash(page);
  setPage(page);
});

/* ---------- 9. RENDER ---------- */
function renderPage(){
  const content = document.getElementById('content');
  if (currentPage === 'status') {
    content.innerHTML = renderStatusPage();
  } else {
    content.innerHTML = renderModulePage(currentPage);
    mountModuleEvents(currentPage);
  }
}

function renderStatusPage(){
  const counts = PAGE_ORDER.slice(1).map(k => {
    const mod = MODULES[k];
    return `<a class="stat-card" href="#/${k}" data-goto="${k}">
      <div class="stat-ico">${mod.icon}</div>
      <div>
        <div class="stat-val">${(DB[k] || []).length}</div>
        <div class="stat-lbl">${esc(mod.label)}</div>
      </div>
    </a>`;
  }).join('');

  const totalProjek  = DB.projek.reduce((s, r) => s + (Number(r.nilai) || 0), 0);
  const totalInvois  = DB.invoice.reduce((s, r) => s + (Number(r.jumlah) || 0), 0);
  const belumBayar   = DB.invoice
      .filter(r => /belum|sebahagian/i.test(r.status || ''))
      .reduce((s, r) => s + (Number(r.jumlah) || 0), 0);
  const totalBQ      = DB.bq.reduce((s, r) => s + (Number(r.jumlah) || 0), 0);

  const statusMap = {};
  DB.projek.forEach(p => {
    const s = p.status || 'Lain-lain';
    statusMap[s] = (statusMap[s] || 0) + 1;
  });
  const maxStatus = Math.max(1, ...Object.values(statusMap));
  const barColors = { Aktif:'#2563eb', Siap:'#10b981', Tertunggak:'#f59e0b', Batal:'#ef4444' };

  const bars = Object.entries(statusMap).map(([s, n]) => `
    <div class="bar-row">
      <div class="bar-lbl">${esc(s)}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(n / maxStatus) * 100}%;background:${barColors[s] || '#94a3b8'}"></div>
      </div>
      <div class="bar-num">${n}</div>
    </div>`).join('') || '<div class="muted">Tiada data projek.</div>';

  return `
    <div class="stat-grid">${counts}</div>

    <div class="panel">
      <div class="section-title">💰 Ringkasan Kewangan</div>
      <div class="fin-grid">
        <div class="fin-item"><div class="fin-lbl">Jumlah Nilai Projek</div><div class="fin-val">${money(totalProjek)}</div></div>
        <div class="fin-item green"><div class="fin-lbl">Jumlah Invois</div><div class="fin-val">${money(totalInvois)}</div></div>
        <div class="fin-item orange"><div class="fin-lbl">Belum Dibayar</div><div class="fin-val">${money(belumBayar)}</div></div>
        <div class="fin-item"><div class="fin-lbl">Jumlah BQ</div><div class="fin-val">${money(totalBQ)}</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">📈 Status Projek</div>
      ${bars}
    </div>

    <div class="panel">
      <div class="section-title">🕒 Projek Terkini</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nama Projek</th><th>Klien</th><th>Nilai</th><th>Status</th></tr></thead>
          <tbody>
            ${DB.projek.slice(-5).reverse().map(p => `
              <tr>
                <td>${esc(p.nama)}</td>
                <td>${esc(p.klien || '—')}</td>
                <td>${money(p.nilai)}</td>
                <td><span class="badge ${badgeClass(p.status)}">${esc(p.status || '—')}</span></td>
              </tr>`).join('') || `<tr><td colspan="4" class="muted" style="text-align:center;padding:26px">Tiada projek.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderModulePage(key){
  const mod = MODULES[key];
  const q = searchState[key] || '';
  const all = DB[key] || [];
  const rows = all.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
  const cols = mod.columns.map(ck => mod.fields.find(f => f.key === ck)).filter(Boolean);

  let html = `
    <div class="toolbar">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Cari ${esc(mod.label.toLowerCase())}…" value="${esc(q)}">
      </div>
      <div class="toolbar-actions">
        <span class="count-chip">${rows.length} / ${all.length} rekod</span>
        ${isAdmin()
          ? `<button class="btn btn-primary" id="addBtn">＋ Tambah ${esc(mod.label)}</button>`
          : `<span class="readonly-chip">👁 Mod Lihat Sahaja</span>`}
      </div>
    </div>
  `;

  if (rows.length === 0) {
    html += `<div class="empty">📭 Tiada rekod dijumpai${q ? ' untuk carian "' + esc(q) + '"' : ''}.</div>`;
  } else {
    html += `<div class="table-wrap"><table>
      <thead><tr>
        <th style="width:48px">#</th>
        ${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}
        <th class="actions-col">Tindakan</th>
      </tr></thead>
      <tbody>
        ${rows.map((r, i) => `
          <tr>
            <td class="muted">${i + 1}</td>
            ${cols.map(c => `<td>${renderCell(r, c)}</td>`).join('')}
            <td class="actions-col">
              <button class="icon-btn" data-act="view" data-id="${r.id}" title="Lihat">👁️</button>
              ${isAdmin() ? `
                <button class="icon-btn" data-act="edit" data-id="${r.id}" title="Pinda">✏️</button>
                <button class="icon-btn del" data-act="del" data-id="${r.id}" title="Hapus">🗑️</button>` : ''}
            </td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
  }
  return html;
}

function renderCell(row, field){
  const v = row[field.key];
  if (field.type === 'file') {
    if (!v || !v.data) return '<span class="muted">—</span>';
    return `<a class="file-link" href="${v.data}" download="${esc(v.name)}" target="_blank" title="${esc(v.name)}">📎 ${esc(v.name)}</a>`;
  }
  if (field.badge) {
    if (!v) return '<span class="muted">—</span>';
    return `<span class="badge ${badgeClass(v)}">${esc(v)}</span>`;
  }
  if (field.money) return v === '' || v === null || v === undefined ? '<span class="muted">—</span>' : money(v);
  if (v === '' || v === null || v === undefined) return '<span class="muted">—</span>';
  return esc(v);
}

/* ---------- 10. EVENT MODUL ---------- */
function mountModuleEvents(key){
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', e => {
      searchState[key] = e.target.value;
      renderPage();
      const si = document.getElementById('searchInput');
      if (si) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
    });
  }
  const addBtn = document.getElementById('addBtn');
  if (addBtn) addBtn.addEventListener('click', () => openForm(key, null));
}

function handleContentClick(e){
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const key = currentPage;
  if (!MODULES[key]) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;

  if (act === 'view') openView(key, id);
  if (act === 'edit' && isAdmin()) openForm(key, id);
  if (act === 'del' && isAdmin()) deleteRecord(key, id);
}

/* ---------- 11. MODAL ---------- */
function showModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" data-overlay><div class="modal">${html}</div></div>`;
  const overlay = root.querySelector('[data-overlay]');
  overlay.addEventListener('click', e => {
    if (e.target === overlay || e.target.closest('[data-close]')) closeModal();
  });
  document.addEventListener('keydown', escClose);
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}
function escClose(e){ if (e.key === 'Escape') closeModal(); }

/* ---------- 12. BORANG ---------- */
function openForm(key, id){
  if (!isAdmin()) return;
  const mod = MODULES[key];
  const rec = id ? (DB[key] || []).find(r => r.id === id) : null;
  const data = rec ? JSON.parse(JSON.stringify(rec)) : {};
  formFileData = {};

  const fieldsHtml = mod.fields.map(f => fieldHtml(f, data)).join('');

  showModal(`
    <div class="modal-head">
      <h3>${rec ? '✏️ Pinda' : '＋ Tambah'} ${esc(mod.label)}</h3>
      <button class="modal-close" data-close>✕</button>
    </div>
    <form id="recordForm" class="modal-body">
      <div class="form-grid">${fieldsHtml}</div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Batal</button>
        <button type="submit" class="btn btn-primary">💾 Simpan</button>
      </div>
    </form>
  `);

  document.querySelectorAll('[data-file]').forEach(inp => {
    inp.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > MAX_FILE_MB * 1024 * 1024) {
        alert(`Saiz fail melebihi ${MAX_FILE_MB} MB. Sila pilih fail yang lebih kecil.`);
        e.target.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = ev => {
        formFileData[inp.dataset.file] = {
          name: file.name, type: file.type, size: file.size, data: ev.target.result
        };
        const cur = document.getElementById('fileCur_' + inp.dataset.file);
        if (cur) cur.innerHTML = '📎 ' + esc(file.name) + ' <span class="muted">(baharu)</span>';
      };
      reader.readAsDataURL(file);
    });
  });

  document.getElementById('recordForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const obj = rec ? { ...rec } : { id: uid() };

    mod.fields.forEach(f => {
      if (f.type === 'file') {
        if (formFileData[f.key] !== undefined) obj[f.key] = formFileData[f.key];
        else if (!rec) obj[f.key] = null;
      } else {
        let val = fd.get(f.key);
        if (val === null) val = '';
        if (f.type === 'number') val = val === '' ? '' : Number(val);
        obj[f.key] = val;
      }
    });

    if (typeof mod.compute === 'function') mod.compute(obj);

    if (rec) {
      const idx = DB[key].findIndex(r => r.id === rec.id);
      DB[key][idx] = obj;
    } else {
      DB[key].push(obj);
    }

    saveDB();
    closeModal();
    renderPage();
    toast(rec ? 'Rekod berjaya dipinda.' : 'Rekod baharu berjaya ditambah.');
  });
}

function fieldHtml(f, data){
  const v = data[f.key] ?? '';
  const req = f.required ? 'required' : '';
  let input = '';

  if (f.type === 'textarea') {
    input = `<textarea name="${f.key}" ${req} placeholder="Masukkan ${esc(f.label.toLowerCase())}">${esc(v)}</textarea>`;
  } else if (f.type === 'select') {
    input = `<select name="${f.key}" ${req}>
      ${(f.options || []).map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}
    </select>`;
  } else if (f.type === 'file') {
    const cur = data[f.key];
    input = `<input type="file" data-file="${f.key}">
      <div class="file-current" id="fileCur_${f.key}">
        ${cur && cur.name ? '📎 ' + esc(cur.name) : 'Tiada fail dilampirkan'}
      </div>`;
  } else {
    const t = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
    input = `<input type="${t}" name="${f.key}" value="${esc(v)}" ${f.type === 'number' ? 'step="any"' : ''} ${req}>`;
  }

  const full = (f.type === 'textarea' || f.type === 'file') ? 'full' : '';
  return `<div class="form-row ${full}">
    <label>${esc(f.label)}${f.required ? ' *' : ''}</label>
    ${input}
  </div>`;
}

/* ---------- 13. PAPARAN BUTIRAN ---------- */
function openView(key, id){
  const mod = MODULES[key];
  const rec = (DB[key] || []).find(r => r.id === id);
  if (!rec) return;

  const items = mod.fields.map(f => {
    let val;
    if (f.type === 'file') {
      val = rec[f.key] && rec[f.key].data
        ? `<a class="file-link" href="${rec[f.key].data}" download="${esc(rec[f.key].name)}" target="_blank">📎 ${esc(rec[f.key].name)}</a>`
        : '<span class="muted">Tiada fail</span>';
    } else if (f.badge) {
      val = rec[f.key] ? `<span class="badge ${badgeClass(rec[f.key])}">${esc(rec[f.key])}</span>` : '<span class="muted">—</span>';
    } else if (f.money) {
      val = rec[f.key] === '' || rec[f.key] == null ? '<span class="muted">—</span>' : money(rec[f.key]);
    } else {
      val = rec[f.key] === '' || rec[f.key] == null ? '<span class="muted">—</span>' : esc(rec[f.key]);
    }
    const full = (f.type === 'textarea' || f.type === 'file') ? 'full' : '';
    return `<div class="detail-item ${full}">
      <div class="detail-lbl">${esc(f.label)}</div>
      <div class="detail-val">${val}</div>
    </div>`;
  }).join('');

  showModal(`
    <div class="modal-head">
      <h3>👁️ Butiran ${esc(mod.label)}</h3>
      <button class="modal-close" data-close>✕</button>
    </div>
    <div class="modal-body"><div class="detail-grid">${items}</div></div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" data-close>Tutup</button>
      ${isAdmin() ? `<button type="button" class="btn btn-primary" id="editFromView">✏️ Pinda</button>` : ''}
    </div>
  `);

  const editBtn = document.getElementById('editFromView');
  if (editBtn) editBtn.addEventListener('click', () => { closeModal(); openForm(key, id); });
}

/* ---------- 14. HAPUS ---------- */
function deleteRecord(key, id){
  if (!isAdmin()) return;
  const rec = DB[key].find(r => r.id === id);
  if (!rec) return;
  const name = rec.nama || rec.noRujukan || rec.noInvois || rec.noBQ || 'rekod ini';
  if (!confirm(`Padam "${name}"?\n\nTindakan ini tidak boleh dibatalkan.`)) return;
  DB[key] = DB[key].filter(r => r.id !== id);
  saveDB();
  renderPage();
  toast('Rekod telah dipadam.');
}

/* ---------- 15. INIT ---------- */
(async function init(){
  try { DB = await loadDB(); }
  catch (e) { console.error('loadDB gagal:', e); DB = createSeed(); }

  window.addEventListener('error', ev => console.warn('[RALAT JS]', ev.message));

  const form = document.getElementById('loginForm');
  if (!form) { console.error('Elemen #loginForm tidak dijumpai.'); return; }
  form.addEventListener('submit', handleLogin);

  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('menuToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });

  document.getElementById('content').addEventListener('click', handleContentClick);

  let saved = null;
  try { saved = await Store.get(SESSION_KEY); } catch (e) {}
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      if (currentUser && currentUser.role) showApp();
    } catch (e) { Store.del(SESSION_KEY); }
  }
})();
</script>
